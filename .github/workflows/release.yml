name: Release verification

on:
  release:
    types: [published]

# Publishing to npm is currently MANUAL — see RELEASING.md. Automating it from CI (OIDC trusted
# publishing) is blocked by upstream tooling: the org enforces 2FA (tokens get EOTP and are being
# deprecated), pnpm's recursive publish doesn't do the OIDC exchange, and the CI npm's provenance
# path is missing `sigstore`. Tracked in issue #2. This workflow only verifies that the tagged
# commit is healthy — it does not publish.

permissions:
  contents: read

jobs:
  verify:
    # Ubuntu: the full suite on the native @contentauth/c2pa-node backend, then
    # the C2PA tests forced onto the pinned c2patool fallback (ADR-0042). The
    # macOS runner is covered by the CI matrix on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install c2patool (pinned) — the C2PA fallback backend
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o c2patool.tar.gz "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.27.22/c2patool-v0.27.22-x86_64-unknown-linux-gnu.tar.gz"
          echo "6f138ad53da1a62f1cd6ee71c60727efa27d13b811f4c0ea8c2a8528968b358b  c2patool.tar.gz" | sha256sum -c -
          tar -xzf c2patool.tar.gz
          echo "$RUNNER_TEMP/c2patool" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          GSENGAI_EXPECT_BACKEND: native
      - name: Test the c2patool fallback backend
        run: pnpm vitest run packages/c2pa apps/demo
        env:
          GSENGAI_C2PA_BACKEND: c2patool
          GSENGAI_EXPECT_BACKEND: c2patool
      - run: pnpm build
